<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icons.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Ayushman Singh — Full-Stack Developer & AI Integration Engineer based in Delhi NCR." />
  <title>Ayushman Singh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script type="text/javascript">
    (function (c, l, a, r, i, t, y) {
      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
      t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
      y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
    })(window, document, "clarity", "script", "wo2b7c973z");
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- ⚡ HTMX Engine for AI Copilot Widget -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>

  <style>
    .copilot-iframe {
      position: fixed;
      bottom: 0;
      right: 0;
      z-index: 99999;
      border: none;
      width: 105px;
      height: 105px;
      background: transparent;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .copilot-iframe.is-expanded {
      width: min(440px, 100vw);
      height: min(540px, 100dvh);
    }

    @media (max-width: 480px) {
      .copilot-iframe {
        bottom: 0;
        right: 0;
        width: 95px;
        height: 95px;
      }

      .copilot-iframe.is-expanded {
        width: 100vw;
        height: min(540px, 100dvh);
      }
    }
  </style>
  <iframe src="https://universal-copilot.onrender.com/copilot/embed?app_id=ayushman_portfolio2"
    style="position: fixed; bottom: 20px; right: 20px; z-index: 99999; border: none; width: 380px; height: 520px; background: transparent;"
    allowtransparency="true">
  </iframe>

  <script>
    (function () {
      const iframe = document.querySelector('.copilot-iframe');
      if (!iframe) return;

      // Expand iframe when user interacts with it
      window.addEventListener('blur', () => {
        if (document.activeElement === iframe) {
          iframe.classList.add('is-expanded');
        }
      });

      // Collapse iframe when user taps outside on the main window
      window.addEventListener('click', (e) => {
        if (iframe && !iframe.contains(e.target)) {
          iframe.classList.remove('is-expanded');
        }
      });

      // Handle touch on mobile to expand
      iframe.addEventListener('touchstart', () => {
        iframe.classList.add('is-expanded');
      }, { passive: true });
    })();
  </script>
</body>

</html>
